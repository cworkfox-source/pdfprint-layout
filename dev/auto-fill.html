<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Phase 6 dev harness — Auto Imposition</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 1rem; color: #222; }
  h1 { font-size: 1.1rem; }
  .layout { display: flex; gap: 1rem; align-items: flex-start; }
  .controls { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.75rem; }
  .controls label { display: flex; flex-direction: column; font-size: 12px; gap: 2px; }
  #gallery { display: flex; flex-direction: column; gap: 8px; border: 1px solid #ccc; padding: 8px; min-height: 100px; background: #fafafa; width: 160px; }
  .tile { border: 1px solid #ddd; background: #fff; padding: 4px; font-size: 10px; word-break: break-all; }
  .tile img { width: 100%; height: 50px; object-fit: contain; background: #eee; display: block; }
  .tile .placeholder { width: 100%; height: 50px; background: #eee; display: flex; align-items: center; justify-content: center; color: #999; font-size: 9px; }
  #pages { display: flex; flex-direction: column; gap: 12px; flex: 1; max-height: 75vh; overflow: auto; padding: 8px; background: #eee; border: 1px solid #ccc; }
  .page-card { background: #fff; border: 1px solid #ccc; padding: 8px; }
  .page-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 12px; }
  .page-card-header button { margin-left: 4px; }
  .pl-slot { font-size: 8px; color: #900; overflow: hidden; }
  #hint { font-size: 12px; color: #b06000; min-height: 1.2em; }
  #readout { font-family: ui-monospace, monospace; font-size: 12px; white-space: pre; margin-top: 0.5rem; max-height: 160px; overflow: auto; }
  #log { font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; margin-top: 0.5rem; border-top: 1px solid #ccc; padding-top: 0.5rem; max-height: 140px; overflow: auto; }
  .pass { color: #0a7d28; }
  .fail { color: #b00020; }
</style>
</head>
<body>
<h1>Phase 6 dev harness — 不是產品 UI，僅供人工／自動化檢查 Auto Imposition（見 docs/plan.md Phase 6 / §11）</h1>

<div class="controls">
  <label>PDF / Image 檔案
    <input id="file-input" type="file" multiple accept=".pdf,.png,.jpg,.jpeg,.webp,image/*,application/pdf">
  </label>
  <label>版型 Preset
    <select id="preset-select"></select>
  </label>
  <button id="apply-preset">Apply Preset(重設為 1 頁)</button>
  <span>|</span>
  <label>順序
    <select id="fill-order">
      <option value="sequential">順序填入</option>
      <option value="reverse">逆序填入</option>
    </select>
  </label>
  <label>篩選
    <select id="fill-filter">
      <option value="all">全部</option>
      <option value="odd">僅奇數頁</option>
      <option value="even">僅偶數頁</option>
    </select>
  </label>
  <label>每張重複 N 次
    <input id="fill-repeat" type="number" min="1" value="1" style="width:4em">
  </label>
  <button id="run-auto-fill">Run Auto Fill (§11.1)</button>
</div>
<div id="hint"></div>

<div class="layout">
  <div id="gallery"></div>
  <div id="pages"></div>
</div>

<div id="readout"></div>
<div id="log"></div>

<script type="module">
  import * as pdfjsLib from '/vendor/pdfjs/pdf.mjs';
  import { createStore } from '/src/store.js';
  import { createAppState, createPage } from '/src/model.js';
  import { computePaperPreviewLayout, resolveZoom, renderPaper, renderSlots, renderSlotContent, computeSlotPx } from '/src/preview.js';
  import { generatePresetSlots, createSlotsFromRects, listPresetIds } from '/src/layout.js';
  import { detectMixedSourceSizes } from '/src/auto-fill.js';
  import { autoFillAction, addPageAction, deletePageAction, duplicatePageAction, movePageAction } from '/src/reducers.js';
  import { createSourceEngine } from '/src/sources.js';
  import { renderPdfPageThumbnail, decodeImage, renderImageThumbnail, renderPdfPagePreview, renderImagePreview } from '/src/render-adapters.js';
  import { createBinaryStore } from '/src/binary-store.js';

  pdfjsLib.GlobalWorkerOptions.workerSrc = '/vendor/pdfjs/pdf.worker.mjs';

  const $ = (id) => document.getElementById(id);
  const gallery = $('gallery');
  const pagesEl = $('pages');
  const logEl = $('log');

  const log = (msg, ok) => {
    const line = document.createElement('div');
    line.className = ok === undefined ? '' : (ok ? 'pass' : 'fail');
    line.textContent = `${ok === undefined ? '·' : (ok ? '[PASS]' : '[FAIL]')} ${msg}`;
    logEl.appendChild(line);
    console.log(msg);
  };

  const binaryStore = createBinaryStore();
  const sources = new Map(); // sourceId -> Source, in load/Gallery order (== fill order)
  const requestedPreviews = new Set();

  const engine = createSourceEngine({
    binaryStore,
    renderPdfPageThumbnail,
    decodeImage,
    renderImageThumbnail,
    renderPdfPagePreview,
    renderImagePreview,
    onThumbnailReady: (sourceId) => {
      const img = document.querySelector(`.tile[data-source-id="${sourceId}"] img`);
      const placeholder = document.querySelector(`.tile[data-source-id="${sourceId}"] .placeholder`);
      const thumb = engine.getThumbnail(sourceId);
      if (img && thumb) {
        img.src = thumb.url;
        img.style.display = '';
        if (placeholder) placeholder.style.display = 'none';
      }
      render();
    },
    onThumbnailError: (sourceId, err) => log(`縮圖失敗 ${sourceId}: ${err.message}`, false),
  });

  for (const id of listPresetIds()) {
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = id;
    $('preset-select').appendChild(opt);
  }
  $('preset-select').value = '4up';

  const paper = { size: 'A4', orientation: 'portrait', marginTopPt: 28, marginBottomPt: 28, marginLeftPt: 28, marginRightPt: 28, gapHorizontalPt: 8, gapVerticalPt: 8 };

  function presetSlots(presetId) {
    const layout = computePaperPreviewLayout(paper, 1);
    const rects = generatePresetSlots(presetId, {
      contentAreaWidthPt: layout.contentAreaPt.width,
      contentAreaHeightPt: layout.contentAreaPt.height,
      gapHorizontalPt: paper.gapHorizontalPt,
      gapVerticalPt: paper.gapVerticalPt,
    });
    return createSlotsFromRects(rects);
  }

  const store = createStore(createAppState({ pages: [createPage({ paper, slots: presetSlots('4up') })] }));

  function resolveContent(sourceId) {
    if (!sourceId) return null;
    return engine.getPreview(sourceId) ?? engine.getThumbnail(sourceId) ?? null;
  }

  function ensurePreviewsForVisibleSources() {
    for (const page of store.getState().pages) {
      for (const slot of page.slots) {
        if (slot.sourceId && !requestedPreviews.has(slot.sourceId)) {
          requestedPreviews.add(slot.sourceId);
          const source = sources.get(slot.sourceId);
          if (source) {
            engine.ensurePreview(source).then(() => render()).catch((err) => log(`Preview 渲染失敗 ${slot.sourceId}: ${err.message}`, false));
          }
        }
      }
    }
  }

  function renderPageCard(page, index, total) {
    let card = pagesEl.querySelector(`[data-page-id="${page.id}"]`);
    if (!card) {
      card = document.createElement('div');
      card.className = 'page-card';
      card.dataset.pageId = page.id;
      card.innerHTML = `
        <div class="page-card-header">
          <span class="page-label"></span>
          <span>
            <button data-action="up">↑</button>
            <button data-action="down">↓</button>
            <button data-action="duplicate">Duplicate</button>
            <button data-action="delete">Delete</button>
          </span>
        </div>
        <div class="page-viewport"></div>
      `;
      card.querySelector('[data-action="up"]').addEventListener('click', () => {
        const i = store.getState().pages.findIndex((p) => p.id === page.id);
        store.commit(movePageAction(page.id, i - 1), null);
        render();
      });
      card.querySelector('[data-action="down"]').addEventListener('click', () => {
        const i = store.getState().pages.findIndex((p) => p.id === page.id);
        store.commit(movePageAction(page.id, i + 1), null);
        render();
      });
      card.querySelector('[data-action="duplicate"]').addEventListener('click', () => {
        store.commit(duplicatePageAction(page.id), null);
        render();
      });
      card.querySelector('[data-action="delete"]').addEventListener('click', () => {
        try {
          store.commit(deletePageAction(page.id), null);
        } catch (err) {
          log(err.message, false);
        }
        render();
      });
      pagesEl.appendChild(card);
    }

    const filled = page.slots.filter((s) => s.sourceId).length;
    card.querySelector('.page-label').textContent = `Page ${index + 1}/${total} — ${filled}/${page.slots.length} filled`;

    const viewportEl = card.querySelector('.page-viewport');
    const layout = computePaperPreviewLayout(page.paper ?? paper, resolveZoom('fit-width', {
      containerWidthPx: 220, containerHeightPx: 99999,
      paperWidthPt: computePaperPreviewLayout(page.paper ?? paper, 1).paperPt.width,
      paperHeightPt: computePaperPreviewLayout(page.paper ?? paper, 1).paperPt.height,
    }));
    const paperEl = renderPaper(viewportEl, layout);
    const contentEl = paperEl.querySelector(':scope > .pl-content-area');
    renderSlots(contentEl, page.slots, layout.contentAreaPx.width, layout.contentAreaPx.height);
    for (const el of contentEl.querySelectorAll(':scope > .pl-slot')) {
      const slot = page.slots.find((s) => s.id === el.dataset.slotId);
      const px = computeSlotPx(slot, layout.contentAreaPx.width, layout.contentAreaPx.height);
      renderSlotContent(el, slot, resolveContent(slot.sourceId), px.width, px.height);
    }
    return card;
  }

  function render() {
    ensurePreviewsForVisibleSources();
    const state = store.getState();
    const keepIds = new Set(state.pages.map((p) => p.id));
    for (const card of pagesEl.querySelectorAll('.page-card')) {
      if (!keepIds.has(card.dataset.pageId)) card.remove();
    }
    state.pages.forEach((page, i) => renderPageCard(page, i, state.pages.length));
    // reorder DOM to match state.pages order
    for (const page of state.pages) {
      const card = pagesEl.querySelector(`[data-page-id="${page.id}"]`);
      pagesEl.appendChild(card);
    }

    const mixed = detectMixedSourceSizes([...sources.values()]);
    $('hint').textContent = mixed ? '⚠ 來源尺寸不一致（§11.4）：Auto Fill 會依各 Source 自身尺寸各自 fit，不做全域統一縮放。' : '';

    $('readout').textContent = JSON.stringify({
      pageCount: state.pages.length,
      pages: state.pages.map((p) => ({ id: p.id, slots: p.slots.map((s) => s.sourceId) })),
    }, null, 2);

    window.__state = state;
    window.__store = store;
  }

  function currentTemplatePageId() {
    return store.getState().pages[0].id;
  }

  // --- Gallery: upload -----------------------------------------------------

  function renderTile(source) {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.dataset.sourceId = source.id;
    tile.innerHTML = `
      <div class="placeholder">載入中…</div>
      <img style="display:none">
      <div>${source.kind}${source.kind === 'pdf-page' ? ` p${source.pageIndex + 1}` : ''}</div>
      <div>${source.fileName ?? ''}</div>
    `;
    gallery.appendChild(tile);
  }

  async function handleFiles(fileList) {
    for (const file of fileList) {
      try {
        if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
          const newSources = await engine.loadPdfFile(file, { pdfjsLib, pageRange: 'all' });
          for (const s of newSources) { sources.set(s.id, s); renderTile(s); }
          log(`載入 PDF ${file.name}：${newSources.length} 頁`, true);
        } else {
          const s = await engine.loadImageFile(file);
          sources.set(s.id, s);
          renderTile(s);
          log(`載入圖片 ${file.name}`, true);
        }
      } catch (err) {
        log(`載入失敗 ${file.name}: ${err.message}`, false);
        console.error(err);
      }
    }
    render();
  }

  $('file-input').addEventListener('change', (e) => {
    if (e.target.files.length) handleFiles(e.target.files);
  });

  $('apply-preset').addEventListener('click', () => {
    const presetId = $('preset-select').value;
    store.commit((state) => ({
      ...state,
      pages: [createPage({ paper, slots: presetSlots(presetId) })],
    }), null);
    render();
  });

  $('run-auto-fill').addEventListener('click', () => {
    const sourceIds = [...sources.keys()];
    const fillOptions = {
      order: $('fill-order').value,
      filter: $('fill-filter').value,
      repeatCount: Math.max(1, parseInt($('fill-repeat').value, 10) || 1),
    };
    try {
      store.commit(autoFillAction(currentTemplatePageId(), sourceIds, fillOptions), null);
      log(`Auto Fill 完成:${sourceIds.length} 個來源 → ${store.getState().pages.length} 頁`, true);
    } catch (err) {
      log(`Auto Fill 失敗: ${err.message}`, false);
    }
    render();
  });

  log('就緒，請選擇 PDF 或圖片檔案，然後執行 Auto Fill');
  render();

  // Test-only hooks for scripted (Playwright) verification.
  window.__engine = engine;
  window.__sources = sources;
  window.__handleFiles = handleFiles;
  window.__waitForAllThumbnails = () => engine.waitForAllThumbnails();
  window.__runAutoFill = (fillOptions) => {
    const sourceIds = [...sources.keys()];
    store.commit(autoFillAction(currentTemplatePageId(), sourceIds, fillOptions ?? {}), null);
    render();
  };
  window.__applyPreset = (presetId) => {
    store.commit((state) => ({ ...state, pages: [createPage({ paper, slots: presetSlots(presetId) })] }), null);
    render();
  };
</script>
</body>
</html>
